[project]
name = "srag-insights-agent"
version = "0.1.0"
description = "Generative AI agent that reports on SRAG in Brazil using Open DATASUS data and real-time news."
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.1",
    "jinja2>=3.1.6",
    "langchain-anthropic>=1.7.12",
    "langchain-core>=1.8.4",
    "langgraph>=1.2.24",
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
    "playwright>=1.65.2",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "streamlit>=1.67.0",
    "tavily-python>=0.8.5",
]

[build-system]
requires = ["uv_build>=0.9.25,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "srag"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
extend-exclude = ["docs"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
